limit_req_zone $binary_remote_addr zone=homeos_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=homeos_auth:10m rate=10r/m;

server {
    server_name os.theannexation.fun;
    server_tokens off;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    limit_req_status 429;

    root /srv/homeos/apps/web/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' https: data:; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com/gsi/; upgrade-insecure-requests" always;

    location = /api/auth/google {
        limit_req zone=homeos_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/share-attachments {
        client_max_body_size 13m;
        limit_req zone=homeos_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/dev/terminal/sessions/cx-[a-f0-9-]+/socket$ {
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        limit_req zone=homeos_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/os.theannexation.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.theannexation.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_tokens off;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name os.theannexation.fun;
    return 301 https://$host$request_uri;
}
